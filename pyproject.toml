[project]
name = "sudoku-grover"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "clarkbe8", email = "clarkbe8@msu.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
]

[project.scripts]
sudoku-grover = "sudoku_grover:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
